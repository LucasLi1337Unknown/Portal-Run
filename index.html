<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Portal Race</title>
<style>
:root{--bg:#0a1020;--panel:#121b33;--text:#eef3ff;--muted:#9fb0d6;--violet:#7c5cff;--pink:#ff6b8b;--cyan:#42c9ff;--green:#5ce1a4}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);background:radial-gradient(circle at 15% 10%,#32246c55,transparent 30%),radial-gradient(circle at 85% 10%,#175d7150,transparent 30%),linear-gradient(145deg,#070b15,#0b1122 50%,#111831)}button{font:inherit}.app{max-width:1450px;margin:auto;padding:18px;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px}.card{background:#121b33e8;border:1px solid #ffffff12;border-radius:22px;box-shadow:0 20px 55px #0006;backdrop-filter:blur(12px)}.top{grid-column:1/-1;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;gap:12px;align-items:center}.logo{width:45px;height:45px;border-radius:14px;display:grid;place-items:center;font-size:25px;background:linear-gradient(135deg,#7c5cff,#43d5ff)}h1{font-size:20px;margin:0}.sub{font-size:12px;color:var(--muted);margin-top:2px}.pills{display:flex;gap:8px;flex-wrap:wrap}.pill{font-size:11px;color:#c5d1ed;background:#0c1428;padding:7px 9px;border-radius:999px}.boardCard{padding:16px}.boardHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.boardHead h2{font-size:16px;margin:0}.turn{font-size:12px;background:#0c1428;padding:8px 11px;border-radius:11px}.boardWrap{aspect-ratio:1/1;max-height:calc(100vh - 160px);margin:auto}.board{height:100%;display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(7,1fr);gap:6px;padding:6px;border-radius:25px;background:#0b1327;border:1px solid #ffffff10}.cell{position:relative;border-radius:14px;background:linear-gradient(145deg,#233257,#17213e);border:1px solid #ffffff10;display:flex;align-items:center;justify-content:center;overflow:hidden}.cell.start{background:linear-gradient(145deg,#175d4e,#123d38)}.cell.finish{background:linear-gradient(145deg,#7a5c19,#4e3b12)}.cell.portal{background:linear-gradient(145deg,#50328c,#2e2256)}.cell.forward{background:linear-gradient(145deg,#17626e,#10404a)}.cell.back{background:linear-gradient(145deg,#792f4e,#4b2136)}.cell.shield{background:linear-gradient(145deg,#215582,#173652)}.cell.swap{background:linear-gradient(145deg,#765319,#4b3512)}.cell.mystery{background:linear-gradient(145deg,#60417a,#37294c)}.cell.current{box-shadow:0 0 0 2px #fff5,0 0 25px #7c5cff88}.num{position:absolute;left:7px;top:5px;font-size:9px;color:#8fa0c8}.icon{font-size:21px}.lab{position:absolute;bottom:5px;font-size:8px;color:#dce4f8}.tokens{position:absolute;inset:0;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:3px;padding:20% 8% 8%}.token{width:23px;height:23px;border-radius:50%;display:grid;place-items:center;font-size:9px;font-weight:900;border:2px solid #ffffffaa;box-shadow:0 4px 10px #0006}.you{background:var(--violet)}.mira{background:var(--pink)}.byte{background:var(--cyan)}.orbit{background:var(--green);color:#073229}.center{grid-column:3/6;grid-row:3/6;z-index:3;border-radius:27px;background:radial-gradient(circle at 50% 30%,#7c5cff22,transparent 45%),linear-gradient(145deg,#101931,#0a1227);border:1px solid #ffffff12;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12px}.dice{width:92px;height:92px;border-radius:23px;background:linear-gradient(145deg,#fff,#dce5ff);color:#111a31;display:grid;place-items:center;font-size:48px;box-shadow:0 15px 34px #0007;margin:8px}.dice.rolling{animation:shake .12s infinite}@keyframes shake{0%{transform:rotate(-5deg)}50%{transform:rotate(5deg) scale(1.04)}100%{transform:rotate(-5deg)}}.roll{border:0;border-radius:13px;background:linear-gradient(135deg,#7c5cff,#4f8cff);color:white;font-weight:800;padding:10px 18px;cursor:pointer}.roll:disabled{opacity:.4;cursor:not-allowed}.mini{font-size:10px;color:#a5b3d1;margin-top:7px}.side{display:flex;flex-direction:column;gap:14px}.section{padding:14px}.section h3{font-size:14px;margin:0 0 10px}.player{display:grid;grid-template-columns:42px 1fr auto;gap:9px;align-items:center;padding:9px;border-radius:14px;background:#0d152a;margin-bottom:8px;border:1px solid #ffffff0c}.player.active{border-color:#7c5cff88}.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:900}.name{font-size:13px;font-weight:800}.meta,.pos{font-size:10px;color:#91a2c8}.online{color:#5ce1a4}.think{color:#ffd166}.chatCard{height:280px;display:flex;flex-direction:column}.chat{flex:1;overflow:auto}.msg{font-size:12px;line-height:1.45;margin:7px 0}.sys{color:#8495bb;font-style:italic}.typing{height:18px;font-size:10px;color:#8394b8}.legend{display:grid;grid-template-columns:1fr 1fr;gap:7px}.legend div{font-size:10px;background:#0c1428;padding:7px;border-radius:9px;color:#bdc9e5}.actions{display:flex;gap:8px;margin-top:10px}.small{flex:1;background:#101a33;border:1px solid #ffffff10;color:#dce5fa;border-radius:10px;padding:8px;cursor:pointer}.overlay{display:none;position:fixed;inset:0;z-index:20;background:#050812c7;align-items:center;justify-content:center;padding:20px}.overlay.show{display:flex}.modal{width:min(480px,100%);padding:24px;text-align:center}.modal h2{font-size:27px;margin:0 0 8px}.modal p{color:#afbdd8;line-height:1.6}.toast{position:fixed;z-index:30;left:50%;top:16px;transform:translate(-50%,-15px);opacity:0;background:#101a33;border:1px solid #ffffff15;padding:10px 14px;border-radius:12px;font-size:12px;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:1000px){.app{grid-template-columns:1fr}.top{grid-column:1}.boardWrap{max-height:none}.side{display:grid;grid-template-columns:1fr 1fr}.side .section:last-child{grid-column:1/-1}}@media(max-width:650px){.app{padding:8px;gap:8px}.top{padding:10px}.sub,.pills{display:none}.boardCard{padding:7px}.board{gap:3px;padding:3px}.cell{border-radius:8px}.icon{font-size:16px}.lab{display:none}.num{font-size:7px;left:3px;top:2px}.center{padding:4px}.dice{width:62px;height:62px;font-size:34px;border-radius:16px}.center h3,.mini{display:none}.roll{padding:8px 12px;font-size:11px}.token{width:18px;height:18px;font-size:7px}.side{display:block}.section{margin-top:8px}}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="app">
<div class="top card"><div class="brand"><div class="logo">🌀</div><div><h1>Portal Race</h1><div class="sub">四人异次元棋局 · 正在和“真人网友”对局</div></div></div><div class="pills"><span class="pill">房间 #7F3A</span><span class="pill">延迟 28ms</span><span class="pill">混沌模式</span></div></div>
<div class="boardCard card"><div class="boardHead"><h2>星环赛道</h2><div class="turn" id="turn">轮到你了</div></div><div class="boardWrap"><div class="board" id="board"><div class="center"><div class="mini">当前骰子</div><div class="dice" id="dice">⚀</div><button class="roll" id="rollBtn">摇骰子</button><div class="mini">🎲 摇到 <b>1</b> 可以再摇一次，不是 6 😈</div></div></div></div></div>
<div class="side">
<div class="section card"><h3>👥 玩家</h3><div id="players"></div></div>
<div class="section card chatCard"><h3>💬 房间聊天</h3><div class="chat" id="chat"></div><div class="typing" id="typing"></div></div>
<div class="section card"><h3>🧭 特殊格</h3><div class="legend"><div>🌀 传送门</div><div>⚡ 前进</div><div>🕳️ 后退</div><div>🛡️ 护盾</div><div>🔀 换位</div><div>❓ 神秘事件</div></div><div class="actions"><button class="small" onclick="showRules()">规则</button><button class="small" onclick="restart()">重新开局</button></div></div>
</div></div>
<div class="overlay" id="overlay"><div class="modal card"><h2 id="mTitle">规则</h2><p id="mText"></p><button class="roll" onclick="closeModal()">知道了</button></div></div>
<script>
const N=49,faces=['⚀','⚁','⚂','⚃','⚄','⚅'];const board=document.getElementById('board'),dice=document.getElementById('dice'),rollBtn=document.getElementById('rollBtn'),turn=document.getElementById('turn'),chat=document.getElementById('chat'),typing=document.getElementById('typing'),toastEl=document.getElementById('toast');
const P=[{name:'Lucas',cls:'you',pos:0,shield:false,human:true,status:'在线'},{name:'MiraNova',cls:'mira',pos:0,shield:false,status:'在线'},{name:'ByteBunny',cls:'byte',pos:0,shield:false,status:'在线'},{name:'KJ_Orbit',cls:'orbit',pos:0,shield:false,status:'在线'}];let cur=0,busy=false,over=false;
const coords=[];for(let r=0;r<7;r++){if(r%2===0){for(let c=0;c<7;c++)coords.push([r,c]);}else{for(let c=6;c>=0;c--)coords.push([r,c]);}}
const S={4:{t:'forward',i:'⚡',l:'+3',v:3},7:{t:'portal',i:'🌀',l:'→18',to:18},10:{t:'back',i:'🕳️',l:'-2',v:2},13:{t:'shield',i:'🛡️',l:'护盾'},16:{t:'mystery',i:'❓',l:'事件'},20:{t:'forward',i:'⚡',l:'+4',v:4},23:{t:'swap',i:'🔀',l:'换位'},26:{t:'portal',i:'🌀',l:'→36',to:36},29:{t:'back',i:'🕳️',l:'-3',v:3},32:{t:'shield',i:'🛡️',l:'护盾'},35:{t:'mystery',i:'❓',l:'事件'},39:{t:'forward',i:'⚡',l:'+2',v:2},42:{t:'back',i:'🕳️',l:'-4',v:4},45:{t:'portal',i:'🌀',l:'→47',to:47}};
function build(){document.querySelectorAll('.cell').forEach(x=>x.remove());for(let i=0;i<N;i++){let[r,c]=coords[i],sp=S[i],el=document.createElement('div');el.className='cell'+(i===0?' start':i===48?' finish':sp?' '+sp.t:'');el.dataset.idx=i;el.style.gridRow=r+1;el.style.gridColumn=c+1;el.innerHTML=`<div class="num">${i+1}</div><div class="icon">${i===0?'🚩':i===48?'🏆':sp?sp.i:''}</div><div class="lab">${i===0?'START':i===48?'FINISH':sp?sp.l:''}</div><div class="tokens"></div>`;board.appendChild(el)}render()}
function render(){document.querySelectorAll('.tokens').forEach(x=>x.innerHTML='');document.querySelectorAll('.cell').forEach(x=>x.classList.remove('current'));P.forEach((p,i)=>{let h=document.querySelector(`.cell[data-idx="${p.pos}"] .tokens`);if(h){let t=document.createElement('div');t.className='token '+p.cls;t.textContent=i===0?'Y':p.name[0];t.title=p.name;h.appendChild(t)}});document.querySelector(`.cell[data-idx="${P[cur].pos}"]`)?.classList.add('current');document.getElementById('players').innerHTML=P.map((p,i)=>`<div class="player ${i===cur&&!over?'active':''}"><div class="avatar ${p.cls}">${i===0?'Y':p.name.slice(0,2).toUpperCase()}</div><div><div class="name">${p.name}${i===0?' <span class="meta">(你)</span>':''}</div><div class="meta"><span class="${p.status==='在线'?'online':'think'}">● ${p.status}</span>${p.shield?' · 🛡️护盾':''}</div></div><div class="pos">格 ${p.pos+1}</div></div>`).join('');turn.textContent=over?'游戏结束':cur===0?'轮到你了':`${P[cur].name} 正在思考…`;rollBtn.disabled=busy||over||cur!==0}
function msg(w,t,sys=false){let d=document.createElement('div');d.className='msg'+(sys?' sys':'');d.innerHTML=sys?t:`<b>${w}:</b> ${t}`;chat.appendChild(d);chat.scrollTop=chat.scrollHeight}function toast(t){toastEl.textContent=t;toastEl.classList.add('show');setTimeout(()=>toastEl.classList.remove('show'),1700)}const sleep=m=>new Promise(r=>setTimeout(r,m));
async function rollFor(i){if(busy||over)return;busy=true;render();dice.classList.add('rolling');let f=1;for(let k=0;k<9;k++){f=1+Math.floor(Math.random()*6);dice.textContent=faces[f-1];await sleep(55+k*6)}dice.classList.remove('rolling');msg('系统',`${P[i].name} 摇出了 ${f}`,true);await move(i,f,true);if(over){busy=false;render();return}if(f===1){toast(`${P[i].name} 摇到 1，再来一次！`);msg('系统',`🎲 ${P[i].name} 获得额外一次投掷`,true);busy=false;render();if(i!==0)setTimeout(aiTurn,700+Math.random()*800);return}cur=(cur+1)%4;busy=false;render();if(cur!==0)setTimeout(aiTurn,700+Math.random()*1100)}
async function move(i,n,direct){let p=P[i],target=Math.min(48,p.pos+n);while(p.pos<target){p.pos++;render();await sleep(145)}if(p.pos===48){win(i);return}if(direct)await special(i)}
async function relocate(i,np,why){np=Math.max(0,Math.min(48,np));await sleep(250);P[i].pos=np;render();msg('系统',`${P[i].name} ${why} → 格 ${np+1}`,true);await sleep(330);if(np===48)win(i)}
async function special(i){let p=P[i],s=S[p.pos];if(!s)return;if(s.t==='portal'){toast('🌀 传送门启动！');await relocate(i,s.to,'被传送')}else if(s.t==='forward'){toast(`⚡ 前进 ${s.v} 格`);await relocate(i,p.pos+s.v,`向前冲了 ${s.v} 格`)}else if(s.t==='back'){if(p.shield){p.shield=false;toast('🛡️ 护盾挡住了后退！');msg('系统',`${p.name} 的护盾挡住了陷阱`,true);render()}else{toast(`🕳️ 后退 ${s.v} 格`);await relocate(i,p.pos-s.v,`倒退了 ${s.v} 格`);react(i,'bad')}}else if(s.t==='shield'){p.shield=true;toast('🛡️ 获得一次陷阱免疫');render()}else if(s.t==='swap'){let a=P.map((x,j)=>({j,pos:x.pos})).filter(x=>x.j!==i&&x.pos>0&&x.pos<48).sort((a,b)=>b.pos-a.pos);if(a.length){let o=P[a[0].j],old=p.pos;p.pos=o.pos;o.pos=old;render();toast(`🔀 和 ${o.name} 换位！`);msg('系统',`${p.name} 与 ${o.name} 交换了位置`,true);react(a[0].j,'swap')}else toast('🔀 暂时没人可以交换')}else if(s.t==='mystery'){let e=[['幸运风暴：前进 2 格',2],['踩到香蕉皮：后退 1 格',-1],['捡到能量饮料：前进 3 格',3],['什么也没发生。真的。',0]][Math.floor(Math.random()*4)];toast('❓ '+e[0]);msg('系统',`${p.name} 的神秘事件：${e[0]}`,true);if(e[1])await relocate(i,p.pos+e[1],'触发神秘事件')}}
function react(i,kind='normal'){let sets={normal:['nice','hmm','not bad','bro 😭','I can still catch up','gg maybe?'],bad:['NOOO','bruh','that tile hates me','💀','you have got to be kidding'],swap:['HEY GIVE THAT BACK','nahhh 😭','okay that is personal']},a=sets[kind]||sets.normal;if(Math.random()<.65){typing.textContent=`${P[i].name} 正在输入…`;setTimeout(()=>{typing.textContent='';msg(P[i].name,a[Math.floor(Math.random()*a.length)])},500+Math.random()*1000)}}
async function aiTurn(){if(over||cur===0||busy)return;let i=cur;P[i].status='思考中';render();if(Math.random()<.28)react(i);await sleep(700+Math.random()*1300);P[i].status='在线';render();rollFor(i)}
function win(i){over=true;document.getElementById('mTitle').textContent=i===0?'🏆 你赢了！':`🏆 ${P[i].name} 获胜`;document.getElementById('mText').innerHTML=i===0?'你成功冲进终点。三个“真人网友”正在努力假装自己不是 AI。':`${P[i].name} 抢先到达终点。下一局报仇。`;document.getElementById('overlay').classList.add('show');msg('系统',`🏆 ${P[i].name} 赢得了本局！`,true);render()}
function restart(){P.forEach(p=>{p.pos=0;p.shield=false;p.status='在线'});cur=0;busy=false;over=false;dice.textContent='⚀';chat.innerHTML='';msg('系统','已匹配到 3 名玩家。比赛开始！',true);setTimeout(()=>msg('MiraNova','gl hf 👀'),450);setTimeout(()=>msg('ByteBunny','wait 1 gives another roll?? cursed rules lol'),1100);build()}function showRules(){document.getElementById('mTitle').textContent='📜 规则';document.getElementById('mText').innerHTML='四位玩家从 START 出发，先到终点的人获胜。<br><br>每回合摇 1～6，<b>摇到 1 可以额外再摇一次</b>。<br><br>特殊格有传送、前进、后退、护盾、换位和神秘事件。<br><br><b>防卡 Bug：</b>特殊格造成的移动不会继续触发另一个移动类特殊格，所以不会出现“前进 2 → 后退 2 → 无限循环”。';document.getElementById('overlay').classList.add('show')}function closeModal(){document.getElementById('overlay').classList.remove('show')}rollBtn.onclick=()=>rollFor(0);build();msg('系统','已匹配到 3 名玩家。比赛开始！',true);setTimeout(()=>msg('MiraNova','gl hf 👀'),500);setTimeout(()=>msg('ByteBunny','wait 1 gives another roll?? cursed rules lol'),1200);setTimeout(()=>msg('KJ_Orbit','first time here, dont bully me'),1900);
</script>
</body></html>
